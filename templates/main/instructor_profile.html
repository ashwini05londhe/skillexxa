{% extends "main/base.html" %}
{% block content %}
{% load static %}
<link rel="stylesheet" href="{% static 'main/css/style.css' %}">

<h2>{{ profile.name }} — {{ profile.domain }}</h2>

<section class="card profile-card">
  {% if profile.photo %}
    <img src="{{ profile.photo.url }}" class="avatar" alt="">
  {% endif %}
  <p>{{ profile.bio }}</p>

  <div style="margin-top:12px">
    <a href="{% url 'main:chat' profile.id %}" class="btn">Chat</a>
    <a href="{% url 'main:video_call' profile.id %}" class="btn btn-success">Video Call</a>
  </div>
</section>

<section class="card">
  <h3>Portfolio</h3>
  <div class="grid">
    {% for img in portfolio %}
      <div class="thumb"><img src="{{ img.image.url }}"></div>
    {% empty %}
      <p class="muted">No portfolio yet</p>
    {% endfor %}
  </div>
</section>
{% endblock %}
